<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TROLLING ROLLING!!!</title>
<audio id="bgAudio" src="content/song.mp3" autoplay loop></audio>
<audio id="spaceSound" src="content/help.mp3"></audio>

<style>
    body { margin: 0; background: white; overflow: hidden; }
    #container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    
    /* Main Bouncing/Fractal Image */
    #image { position: absolute; width: 300px; image-rendering: pixelated; z-index: 10; display: block; }
    
    /* Canvas for Maze/Fractal/Voxels */
    canvas { position: absolute; top: 0; left: 0; z-index: 5; pointer-events: none; }

    /* NEW: Spacebar Overlay Image */
    #spaceOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: contain; /* Or 'cover' for full screen */
        z-index: 9999; /* Higher than everything else */
        display: none;
        pointer-events: none;
        image-rendering: pixelated;
    }

    #svg-filters { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>

<svg id="svg-filters">
  <filter id="ripple-filter">
    <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="1" result="noise" id="turbulence" />
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" id="displacement" />
  </filter>
  <filter id="pixel-filter">
    <feMorphology id="pixel-morph" operator="dilate" radius="0" in="SourceGraphic" result="morphed" />
    <feComponentTransfer in="morphed">
      <feFuncR type="discrete" tableValues="0 0.25 0.5 0.75 1" />
      <feFuncG type="discrete" tableValues="0 0.25 0.5 0.75 1" />
      <feFuncB type="discrete" tableValues="0 0.25 0.5 0.75 1" />
    </feComponentTransfer>
  </filter>
</svg>

<div id="container">
    <img id="image" src="">
    <img id="spaceOverlay" src="content/bus.png"> 
    <canvas id="canvas"></canvas>
</div>

<script>
// Elements
const img = document.getElementById("image");
const spaceOverlay = document.getElementById("spaceOverlay");
const spaceSound = document.getElementById("spaceSound");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const turb = document.getElementById("turbulence");
const disp = document.getElementById("displacement");
const pixelMorph = document.getElementById("pixel-morph");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const imageSources = [
    "content/troller.gif",
    "content/troller_fancy.gif",
    "content/trollfader1.gif",
    "content/trollsnake.gif",
    "content/trollhue.gif",
    "content/trollripple.gif",
    "content/trollexplode.gif"
];

// Texture pre-loads
const mazeWallImg = new Image(); mazeWallImg.src = "content/maze/trollwall.gif";
const mazeRareWallImg = new Image(); mazeRareWallImg.src = "content/maze/trollstickman.gif";
const mazeSpriteImg = new Image(); mazeSpriteImg.src = "content/maze/trollernpc.png";
const loadedImages = imageSources.map(src => { const i = new Image(); i.src = src; return i; });

// State Variables
let effect = 0;
let dx = 5, dy = 5, x = 0, y = 0;
let bodies = [], rainBodies = [], scatterBodies = [];
let lastScatterTime = 0;
let worldMap = [], visitMap = [], mazeState = "MOVING", targetAngle = 0, lastGridPos = {x: 1, y: 1};
let mandelZoom = 1, mandelX = -0.7436438870371587, mandelY = 0.1318259042064256;
let carpetScale = 1;
let player = { x: 1.5, y: 1.5, dir: 0, fov: Math.PI / 3, moveSpeed: 0.06, rotSpeed: 0.08 };
let npc = { x: 1.5, y: 1.5, dir: 0, moveSpeed: 0.035 };

// --- SPACEBAR EVENT LOGIC ---
let isSpaceActive = false;
let spaceTimer = null;

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !isSpaceActive) {
        isSpaceActive = true;
        
        // Show the overlay & Play sound
        spaceOverlay.style.display = "block";
        spaceSound.currentTime = 0; // Reset sound if pressed again
        spaceSound.play();

        // Hide after 1 second (1000ms)
        if (spaceTimer) clearTimeout(spaceTimer);
        spaceTimer = setTimeout(() => {
            spaceOverlay.style.display = "none";
            isSpaceActive = false;
        }, 1000);
    }
});

// --- HELPER FUNCTIONS ---
function generateMaze(size) {
    let grid = Array(size).fill().map(() => Array(size).fill(1));
    function carve(cx, cy) {
        grid[cy][cx] = 0;
        const dirs = [[0, -2], [0, 2], [-2, 0], [2, 0]].sort(() => Math.random() - 0.5);
        for (let [dx, dy] of dirs) {
            let nx = cx + dx, ny = cy + dy;
            if (nx > 0 && nx < size - 1 && ny > 0 && ny < size - 1 && grid[ny][nx] === 1) {
                grid[cy + dy / 2][cx + dx / 2] = 0; carve(nx, ny);
            }
        }
    }
    carve(1, 1);
    grid[Math.floor(Math.random()*(size-2))+1][Math.floor(Math.random()*(size-2))+1] = 2;
    return grid;
}

function randomEffect() {
    const totalEffects = 9; // 0 through 8
    effect = Math.floor(Math.random() * totalEffects);
    resetEffects();
}

setInterval(() => { randomEffect(); img.src = imageSources[Math.floor(Math.random() * imageSources.length)]; }, 10000);

function resetEffects() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    img.style.display = (effect >= 6) ? "none" : "block";
    img.style.filter = "none"; img.style.transform = "none"; img.style.width = "300px";
    x = (window.innerWidth / 2) - 150; y = (window.innerHeight / 2) - 150;
    bodies = []; rainBodies = []; scatterBodies = [];
    if (effect === 6) { 
        worldMap = generateMaze(15); visitMap = worldMap.map(r => r.map(() => 0));
        player.x = 1.5; player.y = 1.5; player.dir = 0; mazeState = "MOVING";
    }
    if (effect === 7) mandelZoom = 1;
    if (effect === 8) carpetScale = 1;
}

function animate() {
    requestAnimationFrame(animate);
    // Only clear if not in an additive effect
    if (effect !== 4 && effect !== 6 && effect !== 7 && effect !== 8) ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (effect === 0) wobbleRipple();
    if (effect === 1) dvdBounce();
    if (effect === 2) pixelateColor();
    if (effect === 3) physicsFall();
    if (effect === 4) solitaireRain();
    if (effect === 5) trollerScatter();
    if (effect === 6) mazeScreensaver();
    if (effect === 7) trollMandelbrot();
    if (effect === 8) trollCarpet();
}

// --- EFFECT 8: SIERPIŃSKI CARPET ---
function trollCarpet() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    carpetScale *= 0.993; if (carpetScale <= 1/3) carpetScale = 1;
    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.scale(carpetScale, carpetScale);
    drawRecursiveCarpet(0, 0, Math.max(canvas.width, canvas.height) * 1.5, 4, loadedImages[0]);
    ctx.restore();
}
function drawRecursiveCarpet(x, y, s, l, tex) {
    if (l === 0) { ctx.drawImage(tex, x-s/2, y-s/2, s, s); return; }
    const ns = s / 3; ctx.drawImage(tex, x-ns/2, y-ns/2, ns, ns);
    for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
        if (i === 0 && j === 0) continue;
        drawRecursiveCarpet(x + i * ns, y + j * ns, ns, l - 1, tex);
    }
}

// --- EFFECT 7: MANDELBROT ---
function trollMandelbrot() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    mandelZoom *= 1.05; if (mandelZoom > 1000000) mandelZoom = 1;
    const step = 20, maxIter = 32;
    for (let py = 0; py < canvas.height; py += step) for (let px = 0; px < canvas.width; px += step) {
        let c_re = (px - canvas.width/2)*(3.5/canvas.width)/mandelZoom + mandelX;
        let c_im = (py - canvas.height/2)*(3.5/canvas.height)/mandelZoom + mandelY;
        let zx = 0, zy = 0, iter = 0;
        while (zx*zx + zy*zy <= 4 && iter < maxIter) { let xt = zx*zx - zy*zy + c_re; zy = 2*zx*zy + c_im; zx = xt; iter++; }
        if (iter < maxIter) {
            ctx.save(); ctx.filter = `hue-rotate(${iter*15}deg)`;
            ctx.translate(px, py); ctx.rotate(iter*0.2 + (Date.now()/1000));
            let s = (iter/maxIter)*step*2.5; ctx.drawImage(loadedImages[0], -s/2, -s/2, s, s); ctx.restore();
        }
    }
}

// --- EFFECT 6: MAZE ---
function mazeScreensaver() {
    let gx = Math.floor(player.x), gy = Math.floor(player.y);
    if (mazeState === "MOVING") {
        if (Math.abs(Math.cos(player.dir)) > 0.7) player.y += ( (gy + 0.5) - player.y ) * 0.1;
        else player.x += ( (gx + 0.5) - player.x ) * 0.1;
        let lx = player.x + Math.cos(player.dir)*0.5, ly = player.y + Math.sin(player.dir)*0.5;
        if (worldMap[Math.floor(ly)][Math.floor(lx)] !== 0 || (gx !== lastGridPos.x || gy !== lastGridPos.y)) {
            if (gx !== lastGridPos.x || gy !== lastGridPos.y) visitMap[gy][gx]++;
            lastGridPos = {x: gx, y: gy};
            let opts = [0, Math.PI/2, -Math.PI/2, Math.PI].map(a => {
                let ang = player.dir + a; let tx = Math.floor(player.x + Math.cos(ang)), ty = Math.floor(player.y + Math.sin(ang));
                return { angle: ang, wall: worldMap[ty][tx] !== 0, score: visitMap[ty][tx] || 0 };
            }).filter(o => !o.wall);
            let min = Math.min(...opts.map(o => o.score)); let best = opts.filter(o => o.score === min);
            let straight = best.find(o => Math.abs(((o.angle - player.dir + Math.PI) % (Math.PI * 2)) - Math.PI) < 0.1);
            if (worldMap[Math.floor(ly)][Math.floor(lx)] !== 0 || !straight) {
                mazeState = "TURNING"; targetAngle = (straight && worldMap[Math.floor(ly)][Math.floor(lx)] === 0) ? player.dir : best[Math.floor(Math.random()*best.length)].angle;
            }
        }
        player.x += Math.cos(player.dir)*player.moveSpeed; player.y += Math.sin(player.dir)*player.moveSpeed;
    } else {
        let diff = targetAngle - player.dir; while(diff < -Math.PI) diff += Math.PI*2; while(diff > Math.PI) diff -= Math.PI*2;
        if (Math.abs(diff) > 0.05) player.dir += (diff > 0 ? 1 : -1) * player.rotSpeed;
        else { player.dir = targetAngle; mazeState = "MOVING"; }
    }
    ctx.fillStyle = "#000"; ctx.fillRect(0,0,canvas.width,canvas.height/2);
    ctx.fillStyle = "#111"; ctx.fillRect(0,canvas.height/2,canvas.width,canvas.height/2);
    for (let i = 0; i < 300; i++) {
        let ra = (player.dir - player.fov/2) + (i/300)*player.fov;
        let d = 0, hit = 0, rx = player.x, ry = player.y;
        while(d < 15) { d += 0.05; rx = player.x + Math.cos(ra)*d; ry = player.y + Math.sin(ra)*d; if (worldMap[Math.floor(ry)][Math.floor(rx)] > 0) { hit = worldMap[Math.floor(ry)][Math.floor(rx)]; break; } }
        let h = canvas.height / (d * Math.cos(ra - player.dir) + 0.01);
        let tex = (hit === 2) ? mazeRareWallImg : mazeWallImg;
        if (tex.complete) ctx.drawImage(tex, ((rx+ry)%1)*tex.width, 0, 1, tex.height, i*(canvas.width/300), (canvas.height-h)/2, (canvas.width/300)+1, h);
    }
}

// CHAOS STUBS
function trollerScatter() {
    let now = Date.now(); if (now - lastScatterTime > 80) {
        scatterBodies = []; for (let i = 0; i < 30; i++) scatterBodies.push({ x: Math.random()*(canvas.width-150), y: Math.random()*(canvas.height-150), hue: Math.floor(Math.random()*360), scale: 0.5+Math.random() });
        lastScatterTime = now;
    }
    loadedImages[0].complete && scatterBodies.forEach(b => { ctx.save(); ctx.filter = `hue-rotate(${b.hue}deg)`; ctx.drawImage(loadedImages[0], b.x, b.y, 150*b.scale, 150*b.scale); ctx.restore(); });
}
function wobbleRipple() { let t = Date.now()/1000; turb.setAttribute("baseFrequency", 0.02 + Math.sin(t)*0.01); disp.setAttribute("scale", 40 + Math.sin(t*2)*20); img.style.filter = "url(#ripple-filter)"; }
function pixelateColor() { pixelMorph.setAttribute("radius", ((Math.sin(Date.now()/1500)+1)/2)*6); img.style.filter = "url(#pixel-filter)"; }
function dvdBounce() { img.style.position = "fixed"; x += dx; y += dy; if (x<=0 || x+300>=window.innerWidth) dx*=-1; if (y<=0 || y+300>=window.innerHeight) dy*=-1; img.style.left = x+"px"; img.style.top = y+"px"; }
function physicsFall() { if (!bodies.length) for (let i=0; i<10; i++) bodies.push({ x:Math.random()*canvas.width, y:Math.random()*-300, w:120, h:120, vx:(Math.random()-0.5)*10, vy:Math.random()*5, imgObj:loadedImages[0] }); bodies.forEach(b => { b.vy+=0.4; b.x+=b.vx; b.y+=b.vy; if (b.y+b.h>canvas.height) { b.y=canvas.height-b.h; b.vy*=-0.7; } if (b.x<0 || b.x+b.w>canvas.width) b.vx*=-0.7; ctx.drawImage(b.imgObj, b.x, b.y, b.w, b.h); }); }
function solitaireRain() { if (!rainBodies.length) for (let i=0; i<15; i++) rainBodies.push({ x:Math.random()*canvas.width, y:Math.random()*200, w:80, h:80, vx:(Math.random()-0.5)*15, vy:Math.random()*5, bounce:0.7+Math.random()*0.2, imgObj:loadedImages[0] }); rainBodies.forEach(b => { b.vy+=0.6; b.x+=b.vx; b.y+=b.vy; if (b.y+b.h>canvas.height) { b.y=canvas.height-b.h; b.vy*=-b.bounce; } if (b.x<0 || b.x+b.w>canvas.width) b.vx*=-1; ctx.drawImage(b.imgObj, b.x, b.y, b.w, b.h); }); }

// Init
img.src = imageSources[0]; randomEffect(); animate();
window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
</script>
</body>
</html>
